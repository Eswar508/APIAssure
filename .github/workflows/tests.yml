name: Run Tests
on: [push, pull_request]

# 1. Grant permission to deploy files to gh-pages
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      
      - name: Run Tests
        run: docker compose up --exit-code-from api-tests
        continue-on-error: true

      - name: Copy Allure Results from Container
        if: always()
        run: |
          docker cp restful_booker_tests:/app/allure-results ./allure-results || true

      - name: Upload Allure Results
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30

      # 2. Build the HTML report files
      - name: Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@v1.7
        with:
          allure_results: allure-results
          allure_history: allure-history

      # 3. Deploy the generated report to gh-pages
      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-history